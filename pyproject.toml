[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-tracer"
version = "0.1.0"
description = "Interpret microcontroller firmware on the desktop to trace fault codes and transmitted data."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "tree-sitter>=0.23",
    "tree-sitter-cpp>=0.23",
    "pcpp>=1.30",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
source-tracer = "source_tracer.__main__:main"

[tool.setuptools.packages.find]
include = ["source_tracer*"]

[tool.setuptools.package-data]
source_tracer = ["profiles/*.yaml", "headers/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
